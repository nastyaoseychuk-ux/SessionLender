<form class="inline-form" method="post" action="{% url 'friend-update' requester_id %}">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <button class="btn btn-secondary btn-small" type="submit" name="friend_action" value="accept">Прийняти</button>
  <button class="btn btn-ghost btn-small" type="submit" name="friend_action" value="reject">Відхилити</button>
</form>
