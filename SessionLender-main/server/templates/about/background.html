{% load static %}
<div class="hero-scene background-scene" aria-hidden="true">
  <div class="orbit orbit-one"></div>
  <div class="orbit orbit-two"></div>
  <div class="hero-emblem">
    <img src="{% static 'brand/logo.png' %}" alt="" />
  </div>
  <div class="float-card float-room">
    <span class="square-icon">ST</span>
    <div>
      <b>Studio</b>
      <small data-i18n="sceneRoom">Місце для ваших ідей</small>
    </div>
    <span class="scene-dot"></span>
  </div>
  <div class="float-card float-message">
    <span class="mini-avatar violet">L</span>
    <div>
      <b>@lender</b>
      <small data-i18n="sceneMessage">Зустрінемося у нашій кімнаті?</small>
    </div>
    <span class="ticks">✓✓</span>
  </div>
  <div class="float-card float-invite">
    <span class="spark">✦</span>
    <span data-i18n="sceneInvite">Ви обираєте, до кого приєднатися</span>
  </div>
  <span class="scene-label">YOUR SPACE, YOUR RHYTHM</span>
</div>
