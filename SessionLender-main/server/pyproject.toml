[project]
name = "sessionlender-vercel"
version = "0.3.4"
requires-python = ">=3.12,<3.15"
dependencies = [
  "Django>=5.2,<6.0",
  "Pillow>=10.0",
  "channels>=4.2,<5.0",
  "channels-redis>=4.2,<5.0",
  "dj-database-url>=2.2,<4.0",
  "psycopg[binary]>=3.2,<4.0",
  "vercel==0.12.1",
  "uvicorn>=0.30,<1.0",
  "websockets>=15,<17",
  "python-dotenv>=1.0,<2.0"
]

[tool.vercel]
entrypoint = "sessionlender.vercel_asgi:application"

[tool.vercel.scripts]
build = "python deploy_build.py"
